name: arXiv毎日AI拡張

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "処理対象日 (YYYY-MM-DD, 省略でUTC当日)"
        required: false
        type: string
      language:
        description: "言語 (Japanese/English など)"
        required: false
        type: string
      categories:
        description: "arXivカテゴリ（カンマ区切り）"
        required: false
        type: string
      model_name:
        description: "LLMモデル名 (例: gemini-2.5-pro-preview)"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    outputs:
      has_new_content: ${{ steps.dedup_check.outputs.has_new_content }}
      skip_reason: ${{ steps.dedup_check.outputs.skip_reason }}
    steps:
      - uses: actions/checkout@v4

      - name: Varsを確認・設定
        run: |
          # Set defaults if vars are not set
          echo "LANGUAGE=${{ vars.LANGUAGE || 'Japanese' }}" >> $GITHUB_ENV
          echo "CATEGORIES=${{ vars.CATEGORIES || 'cs.AI,cs.LG,cs.CL,cs.CV,stat.ML' }}" >> $GITHUB_ENV
          echo "MODEL_NAME=${{ vars.MODEL_NAME || 'gemini-2.5-flash' }}" >> $GITHUB_ENV
          echo "MIN_INTERVAL_SECONDS=${{ vars.MIN_INTERVAL_SECONDS || '60' }}" >> $GITHUB_ENV
          
          # Debug output
          echo "LANGUAGE=${{ vars.LANGUAGE || 'Japanese' }}"
          echo "CATEGORIES=${{ vars.CATEGORIES || 'cs.AI,cs.LG,cs.CL,cs.CV,stat.ML' }}"
          echo "MODEL_NAME=${{ vars.MODEL_NAME || 'gemini-2.5-flash' }}"
          echo "MIN_INTERVAL_SECONDS=${{ vars.MIN_INTERVAL_SECONDS || '60' }}"

      - name: 依存関係をインストール
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: 依存関係を同期
        run: |
          uv sync

      - name: arXiv論文をクロール
        id: crawl_step
        run: |
          source .venv/bin/activate
          if [ -n "${{ inputs.date }}" ]; then
            today="${{ inputs.date }}"
          else
            today=$(date -u "+%Y-%m-%d")
          fi
          echo "本日 $today の arXiv 論文クロールを開始します..."

          # 当日のファイルが存在するか確認し、存在する場合は削除して再作成
          if [ -f "data/${today}.jsonl" ]; then
              echo "🗑️ 本日のファイルが既に存在するため削除して作り直します..."
              rm "data/${today}.jsonl"
              echo "✅ 既存ファイルを削除しました: data/${today}.jsonl"
          else
              echo "📝 本日のファイルは存在しないため新規作成します..."
          fi

          cd daily_arxiv
          export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          export LANGUAGE="${{ env.LANGUAGE }}"
          export CATEGORIES="${{ env.CATEGORIES }}"
          export MODEL_NAME="${{ env.MODEL_NAME }}"
          if [ -n "${{ vars.MAX_PAPERS }}" ]; then
            export MAX_PAPERS="${{ vars.MAX_PAPERS }}"
            echo "MAX_PAPERS=$MAX_PAPERS"
          else
            echo "MAX_PAPERS=default(10)"
          fi
          if [ -n "${{ vars.SORT_BY }}" ]; then
            export SORT_BY="${{ vars.SORT_BY }}"
            echo "SORT_BY=$SORT_BY"
          else
            echo "SORT_BY=default(popularity)"
          fi
          if [ -n "${{ vars.SORT_ORDER }}" ]; then
            export SORT_ORDER="${{ vars.SORT_ORDER }}"
            echo "SORT_ORDER=$SORT_ORDER"
          else
            echo "SORT_ORDER=default(desc)"
          fi
          echo "LANGUAGE=$LANGUAGE"
          echo "CATEGORIES=$CATEGORIES"

          # MODEL_NAME が未設定の際に備えてデフォルト値を提供
          if [ -z "$MODEL_NAME" ]; then
            export MODEL_NAME="gemini-2.5-flash"
          fi
          if [ -z "$OPENAI_BASE_URL" ] && [[ "$MODEL_NAME" == gemini-* ]]; then
            export OPENAI_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai"
          fi

          scrapy crawl arxiv -o ../data/${today}.jsonl

          if [ ! -f "../data/${today}.jsonl" ]; then
              echo "クロールに失敗し、データファイルが生成されませんでした"
              exit 1
          fi

          echo "crawl_date=$today" >> $GITHUB_OUTPUT
          echo "クロールが完了しました"

      - name: 重複を確認
        id: dedup_check
        run: |
          source .venv/bin/activate
          echo "重複除去チェックを実行しています..."

          cd daily_arxiv
          set +e
          python daily_arxiv/check_stats.py
          dedup_exit_code=$?
          set -e

          echo "重複除去チェックの終了コード: $dedup_exit_code"
          echo "dedup_exit_code=$dedup_exit_code" >> $GITHUB_OUTPUT

          case $dedup_exit_code in
              0)
                  echo "has_new_content=true" >> $GITHUB_OUTPUT
                  ;;
              1)
                  echo "has_new_content=false" >> $GITHUB_OUTPUT
                  echo "skip_reason=no_new_content" >> $GITHUB_OUTPUT
                  ;;
              2)
                  echo "has_new_content=false" >> $GITHUB_OUTPUT
                  echo "skip_reason=processing_error" >> $GITHUB_OUTPUT
                  exit 1
                  ;;
              *)
                  echo "❌ 不明な終了コードのためワークフローを停止します"
                  echo "has_new_content=false" >> $GITHUB_OUTPUT
                  echo "skip_reason=unknown_error" >> $GITHUB_OUTPUT
                  exit 1
                  ;;
          esac

      - name: AI強化処理
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          source .venv/bin/activate
          today=${{ steps.crawl_step.outputs.crawl_date }}
          echo "AI強化処理を開始します..."

          cd ai
          export OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          export OPENAI_BASE_URL=${{ secrets.OPENAI_BASE_URL }}
          export LANGUAGE="${{ env.LANGUAGE }}"
          export MODEL_NAME="${{ env.MODEL_NAME }}"
          export MIN_INTERVAL_SECONDS="${{ env.MIN_INTERVAL_SECONDS }}"
          if [ -z "$MODEL_NAME" ]; then
            export MODEL_NAME="gemini-2.5-flash"
          fi
          if [ -z "$OPENAI_BASE_URL" ] && [[ "$MODEL_NAME" == gemini-* ]]; then
            export OPENAI_BASE_URL="https://generativelanguage.googleapis.com/v1beta/openai"
          fi

          python enhance.py --data ../data/${today}.jsonl --min-interval-secs "$MIN_INTERVAL_SECONDS"
          if [ $? -ne 0 ]; then
              echo "AI処理に失敗しました"
              exit 1
          fi
          echo "AI強化処理が完了しました"

      - name: Markdownへ変換
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          source .venv/bin/activate
          today=${{ steps.crawl_step.outputs.crawl_date }}
          echo "Markdown 形式への変換を開始します..."

          export LANGUAGE="${{ env.LANGUAGE }}"
          cd to_md
          AI_FILE="../data/${today}_AI_enhanced_${LANGUAGE}.jsonl"

          if [ -f "$AI_FILE" ]; then
              echo "AI強化ファイルを用いて変換しています..."
              python convert.py --data "$AI_FILE"
          else
              echo "エラー: AI強化ファイルが見つかりません"
              echo "AIファイル: $AI_FILE"
              exit 1
          fi

          if [ $? -ne 0 ]; then
              echo "Markdown変換に失敗しました"
              exit 1
          fi
          echo "Markdown変換が完了しました"

      - name: ファイル一覧を更新
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          echo "ファイル一覧を更新しています..."
          ls data/*.jsonl | sed 's|data/||' > assets/file-list.txt
          echo "ファイル一覧の更新が完了しました"

      - name: READMEカタログを更新
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          if [ -f "update_readme.py" ]; then
            source .venv/bin/activate
            python update_readme.py
          else
            echo "READMEテンプレートが見つからないため update_readme.py の実行をスキップします"
          fi

      - name: パスワードハッシュを生成して設定に反映
        if: steps.dedup_check.outputs.has_new_content == 'true'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
        run: |
          echo "🔐 認証用のパスワードハッシュを生成しています..."

          if [ -z "$ACCESS_PASSWORD" ]; then
            echo "⚠️  警告: Secrets に ACCESS_PASSWORD が設定されていません"
            PASSWORD_HASH="DISABLED_NO_PASSWORD_SET_IN_SECRETS"
          else
            PASSWORD_HASH=$(echo -n "$ACCESS_PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
            echo "✅ パスワードハッシュの生成に成功しました"
          fi
          export PASSWORD_HASH

          if [ ! -f "js/auth-config.js" ]; then
            echo "❌ エラー: js/auth-config.js が見つかりません"
            exit 1
          fi

          python3 -c "import os,re; from pathlib import Path; hash_value = os.environ.get('PASSWORD_HASH', 'DISABLED_NO_PASSWORD_SET_IN_SECRETS'); path = Path('js/auth-config.js'); text = path.read_text(); if 'passwordHash' not in text: raise SystemExit('auth-config.js に passwordHash キーがありません'); new_text = re.sub(r\"(passwordHash:\\s*)'[^']+'\", rf\"\\1'{hash_value}'\", text, count=1); path.write_text(new_text)"

          echo "🔐 認証設定が完了しました"

      - name: サマリー
        run: |
          if [ "${{ steps.dedup_check.outputs.has_new_content }}" = "true" ]; then
            echo "✅ ワークフロー完了: 重複除去で新しい内容を検出し正常に処理しました"
          else
            case "${{ steps.dedup_check.outputs.skip_reason }}" in
              "no_new_content")
                echo "ℹ️ ワークフロー完了: 重複除去後に新しい内容はありませんでした"
                ;;
              "processing_error")
                echo "⚠️ ワークフロー完了: 重複処理でエラーが発生しました"
                ;;
              "unknown_error")
                echo "⚠️ ワークフロー完了: 不明なエラーが発生しました"
                ;;
              *)
                echo "ℹ️ ワークフロー完了: 不明な理由で処理をスキップしました"
                ;;
            esac
          fi

      - name: 変更をコミット
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          git config --global user.email "${{ vars.EMAIL || 'github-actions[bot]@users.noreply.github.com' }}"
          git config --global user.name "${{ vars.NAME || 'github-actions[bot]' }}"
          git add .
          if git diff --staged --quiet; then
            echo "コミットすべき変更はありません"
            exit 0
          fi
          git commit -m "update: $(date -u '+%Y-%m-%d') arXiv papers"
          echo "変更をコミットしました"

      - name: 最新の変更を取得してプッシュ
        if: steps.dedup_check.outputs.has_new_content == 'true'
        run: |
          git config pull.rebase true
          git config rebase.autoStash true
          for i in {1..3}; do
            echo "プッシュ試行 $i 回目"
            if git push origin main; then
              echo "プッシュに成功しました"
              break
            else
              echo "プッシュに失敗したため最新の変更を取得します..."
              git pull origin main --no-edit || true
              if [ $i -eq 3 ]; then
                echo "3回の試行でもプッシュに失敗しました"
                exit 1
              fi
            fi
          done

      - name: GitHub Pages成果物を準備
        run: |
          SITE_DIR="public-site"
          rm -rf "$SITE_DIR"
          mkdir -p "$SITE_DIR"

          copy_file() {
            local file="$1"
            if [ -f "$file" ]; then
              cp "$file" "$SITE_DIR/"
            fi
          }

          for html in index.html settings.html login.html statistic.html; do
            copy_file "$html"
          done

          copy_dir() {
            local dir="$1"
            if [ -d "$dir" ]; then
              rsync -a "$dir" "$SITE_DIR/"
            fi
          }

          for dir in css js assets images data buy-me-a-coffee; do
            copy_dir "$dir"
          done

          copy_file README.md

      - name: GitHub Pages成果物をアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: public-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesにデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
