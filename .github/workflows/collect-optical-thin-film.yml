name: 光学多層薄膜 arXiv 全件取得

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/collect-optical-thin-film.yml
      - tools/collect_optical_thin_film_arxiv.py
      - research_profiles/optical_multilayer_thin_film_ja.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optical-multilayer-thin-film-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: uvを準備
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 依存関係を同期
        run: uv sync --frozen

      - name: 収集器を静的検査
        run: uv run ruff check tools/collect_optical_thin_film_arxiv.py

      - name: arXivを全件取得
        run: uv run python tools/collect_optical_thin_film_arxiv.py

      - name: 完全性を検証
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("research_data/optical_multilayer_thin_film/manifest.json")
          data_path = Path("research_data/optical_multilayer_thin_film/arxiv_papers.jsonl")

          if not manifest_path.is_file() or not data_path.is_file():
              raise SystemExit("成果物が生成されていません")

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "complete":
              raise SystemExit("収集状態がcompleteではありません")

          rows = [line for line in data_path.read_text(encoding="utf-8").splitlines() if line.strip()]
          if not rows:
              raise SystemExit("取得結果が0件です")

          if len(rows) != manifest.get("paper_count_after_arxiv_id_deduplication"):
              raise SystemExit("manifestの件数とJSONLの件数が一致しません")

          ids = [json.loads(line)["arxiv_id"] for line in rows]
          if len(ids) != len(set(ids)):
              raise SystemExit("arXiv IDの重複が残っています")

          print(f"検証成功: {len(rows)}件")
          PY

      - name: 取得結果をmainへ保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_data/optical_multilayer_thin_film

          if git diff --cached --quiet; then
            echo "取得結果に変更はありません"
            exit 0
          fi

          count=$(python -c 'import json; print(json.load(open("research_data/optical_multilayer_thin_film/manifest.json"))["paper_count_after_arxiv_id_deduplication"])')
          git commit -m "data: collect ${count} optical thin-film arXiv papers"
          git pull --rebase origin main
          git push origin main
